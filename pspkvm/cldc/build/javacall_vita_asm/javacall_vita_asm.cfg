# javacall_vita_asm.cfg — VitaJ2ME: VM CLDC con el intérprete ARM en
# ensamblador generado por loopgen (sin JIT) y ROMIZING=true.
#
# Adaptado de cldc/build/javacall_vita_asm/javacall_vita_asm.cfg de J2Vita
# (https://github.com/KiddRwxSsj/j2vita, GPLv2, mismo origen PSPKVM) y de
# linux_arm.cfg upstream. Diferencias con J2Vita: vitasdk de este proyecto
# es softfp (GCC 10.3, sin Tag_ABI_VFP_args), triplet arm-vita-eabi-, y se
# mantiene -DVITA (ramas VITA de GlobalDefinitions_gcc.hpp/OsMisc/JVM.cpp).
#
# Construcción (ver build-vita-cldc-asm.sh):
#   - HOST tools (tools/loopgen/romgen): Linux i386 nativo (Docker
#     i386/debian), porque loopgen/romgen asumen punteros de 32 bits.
#   - TARGET (make _release): macOS con arm-vita-eabi-*. Los binarios
#     Linux loopgen/romgen se invocan vía un wrapper que hace docker exec.
#

ifndef GNU_TOOLS_DIR
GNU_TOOLS_DIR = $(VITASDK)
endif

# vitasdk solo trae arm-vita-eabi-* (ver javacall_vita_gcc.cfg).
override GCC_PREFIX_arm = $(GNU_TOOLS_DIR)/bin/arm-vita-eabi-
override GCC_PREFIX_arm__BY = javacall_vita_asm.cfg

# Intérprete ARM generado por loopgen; sin compilador dinámico.
# Floats: ENABLE_SOFT_FLOAT=false -> los bytecodes de float llaman a
# runtime C compilado con VFP (softfp: args en registros de enteros, que
# es justo lo que espera el loop generado).
export ENABLE_C_INTERPRETER             := false
export ENABLE_C_INTERPRETER__BY         := javacall_vita_asm.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := javacall_vita_asm.cfg
export ENABLE_FLOAT                     := true
export ENABLE_FLOAT__BY                 := javacall_vita_asm.cfg
export ENABLE_SOFT_FLOAT                := false
export ENABLE_SOFT_FLOAT__BY            := javacall_vita_asm.cfg
export MSW_FIRST_FOR_DOUBLE             := false
export MSW_FIRST_FOR_DOUBLE__BY         := javacall_vita_asm.cfg
export MSW_FIRST_FOR_LONG               := false
export MSW_FIRST_FOR_LONG__BY           := javacall_vita_asm.cfg

# Host = Linux i386 (contenedor Docker). object suffix .o (MakeDeps por
# defecto; NO usar el wrapper java8 con -Dmakedep.objSuffix=.obj).
host_os   = linux
host_arch = i386
os_family = linux
compiler  = gcc
arch      = c

# loopgen/romgen en Linux usan el ticker con pthread/sem_* (OS_linux.cpp).
ifneq ($(IsTarget),true)
LINK_PTHREAD = true
endif

MakeDepsMain_javacall = UnixPlatform
MakeDepsOpts_javacall = -resolveVpath true

ifeq ($(IsLoopGen),true)
    # loopgen: ejecutable HOST con el generador de intérprete ARM.
    os_family = linux
    arch      = arm
    compiler  = gcc
    export ENABLE_INTERPRETER_GENERATOR     := true
    export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_asm.cfg
    CPP_DEF_FLAGS += -DARM -DCROSS_GENERATOR=1
    override ENABLE_COMPILATION_WARNINGS := true
endif

ifeq ($(IsRomGen),true)
    # romgen: HOST con intérprete C, genera la ROM para un ARM 32 bits
    # (igual que el cross-generator de linux_arm.cfg).
    os_family = linux
    arch      = c
    compiler  = gcc
    override ENABLE_COMPILATION_WARNINGS := true
    export ENABLE_C_INTERPRETER             := true
    export ENABLE_C_INTERPRETER__BY         := javacall_vita_asm.cfg
    export ENABLE_INTERPRETER_GENERATOR     := false
    export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_asm.cfg
    export TARGET_MSW_FIRST_FOR_DOUBLE      := false
    export TARGET_MSW_FIRST_FOR_DOUBLE__BY  := javacall_vita_asm.cfg
    export TARGET_MSW_FIRST_FOR_LONG        := false
    export TARGET_MSW_FIRST_FOR_LONG__BY    := javacall_vita_asm.cfg
    carch = arm
    iarch = c
    CPP_DEF_FLAGS += -DARM -DCROSS_GENERATOR=1
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif

INVALID_JAVACALL_OUTPUT_DIR = (\
echo ===================================================================== ; \
echo JAVACALL_OUTPUT_DIR \(environment or GNUmake variable\) must be set.  ; \
echo ===================================================================== )

ifeq ($(IsTarget),true)
ifeq ($(JAVACALL_OUTPUT_DIR),)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error JAVACALL_OUTPUT_DIR is not set)
endif
endif

define fixcygpath_m
echo $(1)
endef

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

ifeq ($(IsTarget),true)
# Toda la VM en modo ARM (como linux_arm): las etiquetas del loop generado
# no llevan tipo %function, así que un llamador Thumb no podría hacer
# interworking con ellas.
export ENABLE_THUMB_VM                  := false
export ENABLE_THUMB_VM__BY              := javacall_vita_asm.cfg
THUMB_CFLAGS                            := -marm -mcpu=cortex-a9
ARM_CFLAGS                              := -marm -mcpu=cortex-a9
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_asm.cfg
ifndef ENABLE_ROM_GENERATOR
export ENABLE_ROM_GENERATOR             = false
export ENABLE_ROM_GENERATOR__BY         = javacall_vita_asm.cfg
endif

# ROMImage.cpp generado emite constantes hex de 32 bits en arrays de int
# (J2Vita hace lo mismo): no es un error de ABI, solo C++11 narrowing.
USER_CFLAGS += -Wno-narrowing

export ENABLE_PCSL = true
export ENABLE_PCSL := true
    os_family = javacall
    arch = arm
    target_arch = arm

export ENABLE_TIMER_THREAD     = false
export ENABLE_TIMER_THREAD__BY = javacall_vita_asm.cfg

export ENABLE_PRODUCT_PRINT_STACK = true
export ENABLE_PRODUCT_PRINT_STACK__BY = javacall_vita_asm.cfg

    export skip_link_image := true

    JAVACALL_INCLUDE_DIR=$(JAVACALL_OUTPUT_DIR)/inc
    JAVACALL_LIB_DIR=$(JAVACALL_OUTPUT_DIR)/lib

    # -DARM: necesario con el loop generado (ARM_EXECUTABLE, fast_memclear
    # lo aporta Interpreter_arm.s). -DVITA: ramas VITA del árbol.
    CPP_DEF_FLAGS += -I$(JAVACALL_INCLUDE_DIR) -DVITA -DARM -mfloat-abi=softfp
endif
