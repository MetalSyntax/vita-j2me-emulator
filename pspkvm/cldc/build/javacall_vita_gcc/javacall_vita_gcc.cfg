ifndef GNU_TOOLS_DIR 
#GNU_TOOLS_DIR = $(VITASDK)/bin (arm-vita-eabi-gcc)
GNU_TOOLS_DIR = $(VITASDK)
endif

# Fase 2b Vita: triplet completo. El patrón genérico (GCC_PREFIX_arm =
# $(GNU_TOOLS_DIR)/bin/ + g++) vale para toolchains con gcc "pelado",
# pero vitasdk solo trae arm-vita-eabi-*. override porque jvm.make lo
# reasigna después con = simple.
override GCC_PREFIX_arm = $(GNU_TOOLS_DIR)/bin/arm-vita-eabi-
override GCC_PREFIX_arm__BY = javacall_vita_gcc.cfg

export ENABLE_C_INTERPRETER             := true
export ENABLE_C_INTERPRETER__BY         := javacall_vita_gcc.cfg
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := javacall_vita_gcc.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := javacall_vita_gcc.cfg

host_os   = cygwin
host_arch = i386
# Fase 2b Vita: host_os se mantiene cygwin a propósito (con host_os=linux
# el build añadiría -static al enlazar romgen y Apple ld lo rechaza).
# os_family=linux para compilar las HOST tools (romgen/loopgen) con
# fuentes Unix reales (OS_linux.cpp) en vez de win32. El TARGET usa
# os_family=javacall (sección IsTarget) y no se ve afectado.
os_family = linux
compiler  = gcc
arch      = c

MakeDepsMain_javacall = UnixPlatform
# Fase 2b Vita: WinGammaPlatform genera rutas con backslash (vale en el
# Cygwin/Windows donde se compilaba PSP, pero no en macOS/Linux).
# UnixPlatform genera incls/... correctos en el host de build.
MakeDepsOpts_javacall = -resolveVpath true

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif

INVALID_JAVACALL_OUTPUT_DIR = (\
echo ===================================================================== ; \
echo JAVACALL_OUTPUT_DIR \(environment or GNUmake variable\) must be set.  ; \
echo Please set it such that it is possible to access                      ; \
echo \$${JAVACALL_OUTPUT_DIR}/inc and \$${JAVACALL_OUTPUT_DIR}/lib         ; \
echo directories.                                                          ; \
echo ===================================================================== )

ifeq ($(JAVACALL_OUTPUT_DIR),)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error JAVACALL_OUTPUT_DIR is not set)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR); then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR} does not point to a directory)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR)/inc; then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR/inc} is not a directory)
endif
ifneq ($(shell if test -d $(JAVACALL_OUTPUT_DIR)/lib; then echo valid; fi),valid)
  $(shell $(INVALID_JAVACALL_OUTPUT_DIR) 1>&2)
  $(error $${JAVACALL_OUTPUT_DIR/lib} is not a directory)
endif

ifneq ($(findstring CYGWIN, $(shell uname)), CYGWIN)
    define fixcygpath_m
    echo $(1)
    endef
else
    define fixcygpath_m
    echo $(1) | xargs -n1 cygpath -m
    endef
endif

LOOP_GEN_FLAGS = +GenerateGNUCode +AddExternCUnderscore
ROM_GEN_FLAGS  = +GenerateGNUCode

ifeq ($(IsTarget),true)
export ENABLE_PCSL = true
export ENABLE_PCSL := true
    os_family = javacall
    arch = c
    target_arch = arm

# Fase 2b Vita: SIN ROM (igual que linux_arm barebone). El generador ROM
# (romgen) es una HOST tool con punteros de 32 bits por diseño (2006) y
# no puede correr en hosts de 64 bits. La CVM carga classes.zip desde
# ux0 en arranque: más lento la primera vez, pero correcto y portable.
ifndef ENABLE_ROM_GENERATOR
export ENABLE_ROM_GENERATOR             = false
export ENABLE_ROM_GENERATOR__BY         = javacall_vita_gcc.cfg
endif

# Bug real #8 (Vita): ENABLE_PREINITED_TASK_MIRRORS (BuildFlags.hpp,
# default 1,1) asume que las system classes ya estan cargadas desde un
# SystemROM image al llamar ROM::link_static_mirror_list() (ver
# Universe::allocate_task en Universe.cpp: "we MUST HAVE SYSTEM CLASSES
# ALREADY LOADED to resolve references to them!!"). Con ROMIZING=false
# (arriba) no hay SystemROM: las system classes se cargan en runtime
# desde cldc_classes.zip, asi que Universe::class_from_id() todavia no
# tiene la tabla poblada en ese punto -> decode_heap_reference() lee un
# puntero basura -> Data abort real en consola (jvm-009.log llego mas
# lejos que nunca: red+heap OK, keythread started; dump
# psp2core-1788469470-...: PC en JVMROM::decode_heap_reference, R3=0x8).
# phoneME ya trae el fallback correcto para este caso (moneY el mismo
# codigo cae a Universe::new_obj_array(...) normal si ml.is_null(), y
# Task::init_classes_inited_at_build() tiene su propio camino bajo
# "#if !ENABLE_PREINITED_TASK_MIRRORS") -- alcanza con apagar el flag
# via el mecanismo oficial EXTRA_JVMCONFIG_<os_family> de jvm.make (no
# hace falta tocar BuildFlags.hpp ni el .cpp).
export EXTRA_JVMCONFIG_javacall = ENABLE_PREINITED_TASK_MIRRORS=0

#MERGE_SOURCE_FILES  = false

export ENABLE_TIMER_THREAD     = false
export ENABLE_TIMER_THREAD__BY = javacall_vita_gcc.cfg

export ENABLE_PRODUCT_PRINT_STACK = true
export ENABLE_PRODUCT_PRINT_STACK__BY = javacall_vita_gcc.cfg

    export skip_link_image := true
    
    JAVACALL_INCLUDE_DIR=$(JAVACALL_OUTPUT_DIR)/inc
    JAVACALL_LIB_DIR=$(JAVACALL_OUTPUT_DIR)/lib

    CPP_DEF_FLAGS += -I$(JAVACALL_INCLUDE_DIR) -DVITA -mfloat-abi=softfp
    # Fase 2b Vita: SIN -DARM (activaba ARM_EXECUTABLE -> fast_memclear
    # externo del backend JIT, inexistente con arch=c; en PSP -DMIPS era
    # igual de decorativo). Solo -DVITA (rama VITA en GlobalDefinitions).
    #LINK_FLAGS += `$(call fixcygpath_m, $(JAVACALL_LIB_DIR)/libjavacall$(BUILD_EXT_javacall).a)` 
endif
