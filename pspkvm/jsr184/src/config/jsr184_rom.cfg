###############################################################################
# jsr184_rom.cfg — configuracion del romizer para el modulo JSR-184.
#
# M3GNative declara los metodos nativos del motor; sus nombres se
# resuelven por simbolo (Java_javax_microedition_m3g_M3GNative_*), asi
# que no se pueden renombrar al romizar.
###############################################################################

DontRenameClass = javax.microedition.m3g.M3GNative
DontRenameNonPublicMethods = javax.microedition.m3g.M3GNative
